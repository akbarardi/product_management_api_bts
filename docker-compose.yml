services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pma_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pma_network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: pma_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pma_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: pma_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-product_management}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - pma_mysql_data:/var/lib/mysql
    networks:
      - pma_network

  redis:
    image: redis:7-alpine
    container_name: pma_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pma_network

networks:
  pma_network:
    driver: bridge

volumes:
  pma_mysql_data:
